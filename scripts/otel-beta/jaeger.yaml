# Jaeger v2, in-memory, loopback only: Caddy (basic auth) is the only way in.
service:
  extensions: [jaeger_storage, jaeger_query]
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [jaeger_storage_exporter]
  telemetry:
    logs:
      level: info
    # The collector on this box already owns :8888.
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 18888
extensions:
  jaeger_query:
    storage:
      traces: store
    http:
      endpoint: 127.0.0.1:16687
    grpc:
      endpoint: 127.0.0.1:16685
  jaeger_storage:
    backends:
      store:
        memory:
          max_traces: 50000
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
exporters:
  jaeger_storage_exporter:
    trace_storage: store
