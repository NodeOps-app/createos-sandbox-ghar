name = "createos-sandbox-ghar"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

[placement]
mode = "smart"

[[durable_objects.bindings]]
name = "COORDINATOR"
class_name = "Coordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Coordinator"]

[triggers]
crons = ["*/5 * * * *"]

# Lets the Worker report which version is serving, on GET /version. `ghar-test`
# gates its smoke jobs on that timestamp so it tests the code the push deployed
# rather than the one it replaced — see the route comment in src/index.ts.
[version_metadata]
binding = "CF_VERSION_METADATA"

[vars]
GITHUB_ORG = "NodeOps-app"
CREATEOS_BASE_URL = "https://api.sb.createos.sh"
# Multi-region failover (primary first): api.sb stays primary, EU absorbs
# 5xx/connection/timeout waves. The primary is named "default" so rows written
# before this var existed (legacy CREATEOS_BASE_URL fallback name) keep
# resolving at teardown. Keep names stable — job rows persist them (AGENTS.md).
CREATEOS_REGIONS = "default=https://api.sb.createos.sh,eu=https://api-eu.sb.createos.sh"
RUNNER_LABEL = "createos"
RUNNER_TEMPLATE = "ghar-runner"
SANDBOX_NAME_PREFIX = "gha-ci"
RUNNER_SHAPE = "s-4vcpu-4gb"
# Shapes below this are discovered from /v1/shapes but never offered as runner
# labels: an Actions runner needs ~2 GiB to check out and build anything.
MIN_RUNNER_MEM_MIB = "2048"
RUNNER_DISK_MIB = "30720"
# Deploy-wide ceiling, checked IN ADDITION to each tenant's own concurrency_cap
# — the lower of the two binds. Raised 50 -> 200 with NodeOps-app's tenant cap so
# a matrix burst (the examples run fans out ~45 jobs at once) is not queued by the
# deploy-wide gate. Community tenants stay bounded by their own caps (5, 10).
MAX_CONCURRENT = "200"
PROVISION_POLICY = "org-wide"
REPO_ALLOWLIST = ""
# GitHub runner group the JIT runner registers into. 1 = the org-wide "Default"
# group. PROVISION_POLICY/REPO_ALLOWLIST only decide which repos we spend a VM
# on; which repos may schedule onto the runner is the GROUP's GitHub policy, not
# ours. To make the allowlist an actual execution boundary, create a runner
# group whose policy scopes it to those repos (org Actions settings) and set
# this to its id.
RUNNER_GROUP_ID = "1"
REAPER_MAX_AGE_MS = "1800000"
RECONCILE_GRACE_MS = "180000"
# Max GitHub subrequests the 5-min recovery scan may spend before it defers the
# rest to the next tick (cursor-resumed). Was 30 under the Free-plan 50-cap; on
# Workers Paid (10,000/invocation) the bound is CreateOS/GitHub courtesy and cron
# wall-time, not the platform. 200 covers every current tenant in one tick; the
# warn-on-bind + (tenant, repo) cursor remain the overflow behavior.
RECOVERY_SUBREQUEST_BUDGET = "200"
# Multi-tenancy master switch. "single" = pre-tenant behavior. "multi" = tenant
# registry gates admission (Plan 3 cutover 2026-07-24; reuses the existing public
# App — no secret swap). Multi-mode admission FAILS CLOSED (refuses every job)
# until a Tenant is seeded+approved — NodeOps prod seeds NodeOps-app first, so it
# ships "multi". A fresh self-host must set "single" here, or seed a Tenant first.
TENANCY_MODE = "multi"
# Per-VM egress quota for community tenants (bytes). 10 GiB.
COMMUNITY_VM_BANDWIDTH_BYTES = "10737418240"
# Apply link shown on refusal check-runs (D17). Points at the repo README until a
# dedicated Google Form exists.
APPLY_FORM_URL = "https://github.com/NodeOps-app/createos-sandbox-ghar#readme"

# Secrets are set via `wrangler secret put` (never commit values here):
# wrangler secret put GITHUB_APP_ID
# wrangler secret put GITHUB_INSTALLATION_ID
# wrangler secret put GITHUB_APP_PRIVATE_KEY   # paste full PKCS#8 PEM
# wrangler secret put GITHUB_WEBHOOK_SECRET
# wrangler secret put CREATEOS_API_KEY

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
# Head-based: a sampled invocation keeps ALL its logs, else none. Was 0.25 to
# halve log volume against the Free-plan 200k/day cap; the account is on Workers
# Paid now and spawn-latency debugging needs EVERY `spawn timeline` /
# `provision breakdown` line — a sampled-out slow spawn is exactly the one you
# wanted. Drop back to 0.25 if log volume becomes a cost problem.
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
