# Tempo 3.x monolithic (-target=all, no Kafka), local disk, loopback only.
# The collector exports OTLP gRPC to :4319; Grafana queries :3200.
stream_over_http_enabled: true
server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3200
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 127.0.0.1:4319
storage:
  trace:
    backend: local
    wal:
      path: /root/otel/tempo/wal
    local:
      path: /root/otel/tempo/blocks
# TraceQL metrics (the dashboard's graphs) are on by default in Tempo 3.x; only their
# maximum query range needs raising from the default 24h.
query_frontend:
  metrics:
    max_duration: 720h
